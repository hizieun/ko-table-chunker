<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640"
     font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="640" fill="#ffffff"/>

  <!-- ============ 1. 원본 표 ============ -->
  <text x="32" y="34" font-size="15" font-weight="700" fill="#1f2328">① 원본 — 2차원 교차표</text>
  <text x="32" y="54" font-size="12" fill="#656d76">행축(범용·전용 × 수수료·이용범위) × 열축(기관 × 개인·법인). 한 행에 레코드가 4개다.</text>

  <g stroke="#c7d9ee" stroke-width="1">
    <!-- 헤더 -->
    <rect x="32" y="68" width="140" height="56" fill="#eef5fe"/>
    <rect x="172" y="68" width="220" height="28" fill="#eef5fe"/>
    <rect x="392" y="68" width="220" height="28" fill="#eef5fe"/>
    <rect x="172" y="96" width="110" height="28" fill="#eef5fe"/>
    <rect x="282" y="96" width="110" height="28" fill="#eef5fe"/>
    <rect x="392" y="96" width="110" height="28" fill="#eef5fe"/>
    <rect x="502" y="96" width="110" height="28" fill="#eef5fe"/>
    <!-- 본문 -->
    <rect x="32" y="124" width="70" height="56" fill="#eef5fe"/>
    <rect x="102" y="124" width="70" height="28" fill="#eef5fe"/>
    <rect x="102" y="152" width="70" height="28" fill="#eef5fe"/>
    <rect x="32" y="180" width="70" height="56" fill="#eef5fe"/>
    <rect x="102" y="180" width="70" height="28" fill="#eef5fe"/>
    <rect x="102" y="208" width="70" height="28" fill="#eef5fe"/>
    <rect x="172" y="124" width="110" height="28" fill="#f9f9f9"/>
    <rect x="282" y="124" width="110" height="28" fill="#f9f9f9"/>
    <rect x="392" y="124" width="110" height="28" fill="#f9f9f9"/>
    <rect x="502" y="124" width="110" height="28" fill="#f9f9f9"/>
    <rect x="172" y="152" width="220" height="28" fill="#f9f9f9"/>
    <rect x="392" y="152" width="220" height="28" fill="#f9f9f9"/>
    <rect x="172" y="180" width="110" height="28" fill="#f9f9f9"/>
    <rect x="282" y="180" width="110" height="28" fill="#fff4e8"/>
    <rect x="392" y="180" width="110" height="28" fill="#f9f9f9"/>
    <rect x="502" y="180" width="110" height="28" fill="#f9f9f9"/>
    <rect x="172" y="208" width="220" height="28" fill="#f9f9f9"/>
    <rect x="392" y="208" width="220" height="28" fill="#f9f9f9"/>
  </g>

  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="102" y="101" font-weight="700">구  분</text>
    <text x="282" y="87" font-weight="700">가온클라우드</text>
    <text x="502" y="87" font-weight="700">한빛호스팅</text>
    <text x="227" y="115">개인</text><text x="337" y="115">법인</text>
    <text x="447" y="115">개인</text><text x="557" y="115">법인</text>

    <text x="67" y="157" font-weight="700">표 준</text>
    <text x="137" y="143">이용료</text><text x="137" y="171">이용범위</text>
    <text x="67" y="213" font-weight="700">전 용</text>
    <text x="137" y="199">이용료</text><text x="137" y="227">이용범위</text>

    <text x="227" y="143">연간 3,300원</text><text x="337" y="143">연간 88,000원</text>
    <text x="447" y="143">연간 3,300원</text><text x="557" y="143">연간 92,400원</text>
    <text x="282" y="171">전 제휴 서비스</text><text x="502" y="171">전 제휴 기관</text>
    <text x="227" y="199">-</text>
    <text x="337" y="199" font-weight="700" fill="#1a7f37">연간 55,000원</text>
    <text x="447" y="199">-</text>
    <text x="557" y="199" fill="#cf222e">연간 3,300원</text>
    <text x="282" y="227">전 계열사</text><text x="502" y="227">전 은행</text>
  </g>

  <rect x="282" y="180" width="110" height="28" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="628" y="198" font-size="12" fill="#1a7f37" font-weight="700">← 정답</text>
  <text x="628" y="214" font-size="11" fill="#656d76">"가온클라우드 법인</text>
  <text x="628" y="228" font-size="11" fill="#656d76">전용 이용료는?"</text>

  <!-- ============ 2. 행 단위 KV (문제) ============ -->
  <text x="32" y="286" font-size="15" font-weight="700" fill="#cf222e">② 행 단위 KV — 3,300원을 답한다</text>

  <rect x="32" y="300" width="816" height="84" rx="4" fill="#fff5f5" stroke="#f3c5c5"/>
  <g font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="46" y="322" fill="#1f2328">구 분: 전 용, <tspan fill="#cf222e" font-weight="700">구 분: 이용료</tspan>, 가온클라우드 &gt; 개인: -,</text>
    <text x="46" y="340" fill="#1f2328">가온클라우드 &gt; 법인: <tspan fill="#1a7f37" font-weight="700">연간 55,000원</tspan>, 한빛호스팅 &gt; 개인: -,</text>
    <text x="46" y="358" fill="#1f2328">한빛호스팅 &gt; 법인: <tspan fill="#cf222e" font-weight="700">연간 3,300원</tspan></text>
  </g>
  <g font-size="11.5" fill="#57606a">
    <text x="46" y="378">① 라벨 `구 분`이 한 줄에 두 번 — 뭐가 대분류인지 알 수 없다   ② 같은 줄에 3,300원이 또 있다 (표 전체엔 3번)   ③ 한 줄에 레코드 4개</text>
  </g>

  <!-- ============ 3. 셀 단위 (해결) ============ -->
  <text x="32" y="432" font-size="15" font-weight="700" fill="#1a7f37">③ 셀 단위 언피벗 — 한 줄이 자기완결적</text>

  <rect x="32" y="446" width="816" height="150" rx="4" fill="#f2fbf5" stroke="#b7e3c5"/>
  <g font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#57606a">
    <text x="46" y="468">표 준 이용료 가온클라우드 &gt; 개인: 연간 3,300원</text>
    <text x="46" y="486">표 준 이용료 가온클라우드 &gt; 법인: 연간 88,000원</text>
    <text x="46" y="526">전 용 이용료 가온클라우드 &gt; 개인: -</text>
    <text x="46" y="582">전 용 이용료 한빛호스팅 &gt; 법인: 연간 3,300원</text>
  </g>
  <text x="46" y="504" font-size="11.5" fill="#57606a"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace">⋮</text>
  <rect x="40" y="540" width="560" height="24" rx="3" fill="#dafbe1"/>
  <text x="46" y="557" font-size="11.5" font-weight="700" fill="#1a7f37"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace">전 용 이용료 가온클라우드 &gt; 법인: 연간 55,000원</text>
  <text x="614" y="557" font-size="11.5" fill="#1a7f37">← 혼동값이 물리적으로 없다</text>

  <!-- 판정 조건 -->
  <text x="32" y="624" font-size="11.5" fill="#656d76">
    판정: 열 헤더 2단 이상(n_header ≥ 2) AND 행 헤더축 2단 이상(header_cols ≥ 2) → 교차표. 행이 레코드인 일반 목록은 행 단위를 유지한다.
  </text>
</svg>
